name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install black isort mypy pydoclint==0.0.8 "pydocstyle[toml]" pytest ruff

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: isort
        run: isort --check .

      - name: mypy
        run: mypy databricks_web_app

      - name: pydoclint
        run: pydoclint --config=pyproject.toml databricks_web_app

      - name: pydocstyle
        run: pydocstyle databricks_web_app

      - name: pytest
        run: pytest -m "not slow"
