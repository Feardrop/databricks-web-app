name: CI

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:

jobs:
  # PRs into main are only allowed from a release/vX.Y.Z branch (see README
  # "Branching"). Feature/fix work targets develop instead.
  branch-policy:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require a release/* branch when targeting main
        run: |
          if [[ "${{ github.head_ref }}" != release/* ]]; then
            echo "::error::PRs into main must come from a release/vX.Y.Z branch (got '${{ github.head_ref }}'). Target 'develop' instead."
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The package (so mypy can resolve imports) plus the tools that the
          # local pre-commit hooks invoke via `language: system`. ruff, black,
          # and isort come from pre-commit's own pinned environments.
          pip install -e .
          pip install pre-commit mypy pydoclint==0.0.8 "pydocstyle[toml]"

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit (lint, format check, type check)
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest httpx

      - name: pytest
        run: pytest -m "not slow"

  # `test` is a matrix job, so GitHub reports each entry as its own check
  # ("test (3.10)", "test (3.11)", ...) and never a check literally named
  # "test". This job gives branch protection one stable name to require,
  # regardless of how many Python versions are in the matrix.
  test-summary:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Require the full test matrix to have passed
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "::error::test matrix result was '${{ needs.test.result }}'."
            exit 1
          fi
