[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks-web-app"
version = "0.0.1"
description = "Reusable Python helpers for Solara web apps that authenticate users and query Databricks through OAuth and machine-to-machine flows."
requires-python = ">=3.10"
dependencies = [
    "databricks-sql-connector[pyarrow]",
    "python-dotenv",
    "solara>=1.29",
    "starlette<1",
    "typing-extensions",
]

[tool.setuptools.packages.find]
include = ["databricks_web_app*"]

[tool.isort]
profile = "black"
known_first_party = ["databricks_web_app"]
sections = ["FUTURE", "STDLIB", "FIRSTPARTY", "THIRDPARTY", "LOCALFOLDER"]
extend_skip = ["venv"]

[tool.ruff]
show-fixes = true
lint.per-file-ignores."__init__.py" = ["F401"]

[tool.pydoclint]
style = "google"
allow-init-docstring = true
check-type-hint = false

[tool.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = "."
markers = [
    "slow: marks tests as slow, use e.g. for tests requiring a Databricks connection",
]

[tool.mypy]
exclude = [
    "^venv",
]
ignore_missing_imports = true
